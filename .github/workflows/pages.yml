# GitHub Pages：根目錄放 main（現行版），/red/ 放 red 分支（赤金登機版），/portra/ 放 portra 分支（Portra 北歐極簡版）。
# 各分支各自維護、不互相合併；這裡只在發布時把各自的組建結果放在一起。
# red、portra 分支有推送時，會由各自的 trigger-pages.yml 觸發這支重新發布。
name: GitHub Pages（main + /red/ + /portra/）

on:
  push:
    branches: [main]
  workflow_dispatch:
  # repo 的 Pages 設定若仍是「Deploy from a branch」，GitHub 會另外跑一次只有 main 的發布，
  # 可能蓋掉 /red/。等它跑完後再發布一次，確保最後上線的一定是 main + /red/。
  # （Pages 設定改成「GitHub Actions」後，那個發布就不會再跑，這個觸發也就不會發生。）
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取出 red 分支
        uses: actions/checkout@v4
        with:
          ref: red
          path: red-src

      - name: 取出 portra 分支
        uses: actions/checkout@v4
        with:
          ref: portra
          path: portra-src

      - name: 組建（沿用各分支自己的白名單檢查）
        run: |
          bash scripts/build-public.sh
          bash red-src/scripts/build-public.sh
          bash portra-src/scripts/build-public.sh
          mkdir -p _site/red _site/portra
          cp -R .deploy-build/. _site/
          cp -R red-src/.deploy-build/. _site/red/
          cp -R portra-src/.deploy-build/. _site/portra/
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
